# Advisor roster for beats-pm-kit. Shared review priorities live in WATCHDOG.md.
# `general` mirrors the default advisor (modelRoles.advisor). `privacy` is a
# cheap specialist kept paused by default — enable it via /advisor configure
# when working with client, partner, or clinical material.
advisors:
  - name: general
    enabled: true

  - name: privacy
    enabled: false
    model: google-antigravity/gemini-3.7-flash
    instructions: |
      You review ONLY for privacy and confidentiality. Ignore style and process.
      Flag as blocker: PHI or member/patient-level data leaving the vault
      (web searches, external MCP writes, shared artifacts); client-confidential
      content from `8. Clients/` or `7. Partners/` appearing in web-facing or
      cross-client output; credentials or tokens echoed into documents.
      Stay silent when nothing qualifies.
